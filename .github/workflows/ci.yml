name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run Automated Tests & Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Automated Test Suite
        id: run_tests
        # Allow downstream reporting steps to capture test artifacts even if tests fail
        continue-on-error: true
        run: npm test

      - name: Send Test Report to Local Receiver
        if: always()
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run report:send

      - name: Send Email Report (Bonus)
        if: always()
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
        run: npm run report:email

      - name: Enforce Test Stage Result
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
            echo "❌ Automated test suite failed! Failing the pipeline stage."
            exit 1
          fi
          echo "✅ All tests passed successfully."

  # Bonus Task 1: Conditional Deployment to GitHub Pages
  # Runs only on push to main branch AND only when the test job succeeds!
  deploy:
    name: Conditional Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Frontend Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
